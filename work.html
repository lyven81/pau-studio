<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work | Pau Studio</title>
<style>
:root{--ink:#252521;--paper:#f7f4ec;--orange:#f3a14d;--line:#d7d3c8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}a{color:inherit}header,main,footer{width:min(1120px,90%);margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--line);gap:12px}.logo{font-weight:850;font-size:1.4rem;text-decoration:none}nav{display:flex;gap:18px}nav a{text-decoration:none}nav a:hover{text-decoration:underline}section{padding:64px 0;border-bottom:1px solid var(--line)}h1,h2{line-height:1.02;letter-spacing:-.055em;margin:0 0 18px}h1{font-size:clamp(3rem,7vw,6.3rem);max-width:1010px}h2{font-size:clamp(2.1rem,4.2vw,3.7rem)}p{max-width:60ch} .intro{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.cta,button{display:inline-block;border:0;background:var(--orange);color:var(--ink);font:inherit;font-weight:750;text-decoration:none;padding:12px 19px;border-radius:6px;cursor:pointer;white-space:nowrap}.showcase{position:relative;min-height:390px;overflow:hidden;border-radius:12px;background:#696452}.showcase span{position:absolute;bottom:16px;left:16px;background:var(--paper);padding:7px 12px;border-radius:4px}.formats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:24px}.format{background:#e9e6dc;border:1px solid var(--line);border-radius:8px;padding:16px;text-align:left;white-space:normal}.format[aria-pressed=true]{background:var(--orange);border-color:var(--ink)}.sample{margin-top:16px;background:#dedfd3;border-radius:10px;padding:24px}.sample p{margin-bottom:0}.contact{display:grid;grid-template-columns:1fr 1fr;gap:32px}form{display:grid;gap:14px}label{display:grid;gap:4px;font-weight:650}input,select,textarea{padding:10px;background:#fffdf8;border:1px solid #827e72;border-radius:5px;font:inherit;width:100%;color:inherit}textarea{min-height:90px}form button{justify-self:start}footer{padding:24px 0}footer small{display:block;margin-top:4px}@media(max-width:650px){section{padding:42px 0}.intro{align-items:flex-start;flex-direction:column}.showcase{min-height:250px}.formats{grid-template-columns:repeat(2,1fr)}.contact{grid-template-columns:1fr}}
header{position:relative;z-index:2}
.menu-toggle{display:flex;align-items:center;gap:9px;background:transparent;border:1px solid var(--line)}
.menu-toggle:hover,.menu-toggle[aria-expanded=true]{background:var(--orange)}
.menu-icon{display:grid;gap:3px;width:18px}
.menu-icon i{height:2px;background:currentColor}
.site-menu{position:absolute;right:0;top:calc(100% + 8px);display:grid;gap:0;width:min(280px,100%);background:#fffdf8;border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 12px 24px #25252122}
.site-menu[hidden]{display:none}
.site-menu a{padding:11px 14px;border-radius:4px;font-weight:650}
.site-menu a:hover,.site-menu a:focus-visible{background:#ebe7dc}
.service-list{max-width:760px;margin:24px 0 0}
.service-list div{display:grid;grid-template-columns:minmax(130px,1fr) 3fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.service-list dt{font-weight:750}
.service-list dd{margin:0}
@media(max-width:520px){.service-list div{grid-template-columns:1fr;gap:4px}}
.site-menu a[aria-current=page]{background:var(--orange)}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
.card{display:grid;gap:6px;padding:8px;background:#e9e6dc;border:1px solid var(--line);border-radius:8px;text-align:left;font-weight:650;white-space:normal;color:var(--ink)}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:5px;display:block}
.card span{font-size:.9rem;line-height:1.3}
.card[aria-current=true]{background:var(--orange);border-color:var(--ink)}
@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}}</style>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header><a class="logo" href="index.html">Pau Studio</a><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu"><span class="menu-icon" aria-hidden="true"><i></i><i></i><i></i></span>Menu</button>
<nav class="site-menu" id="site-menu" aria-label="Main navigation" hidden>
<a href="about.html">About</a><a href="services.html">Services</a><a href="work.html" aria-current="page">Work</a><a href="contact.html">Contact</a>
</nav></header>
<main>
<section id="work">
<h1>Selected work from Ruang Selesa</h1>
<p>Explore how we show home and living products in context, from where a storage rack fits to how it’s used. In our sharing videos, Ruang Selesa’s presenter Elaine offers practical tips for the home.</p>
<div class="formats" id="format-buttons" role="group" aria-label="Content formats"></div>
<div class="sample viewer" id="viewer" aria-live="polite"></div>
<div class="cards" id="cards" aria-label="Latest work in this format"></div>
</section>
</main>
<footer><strong>Pau Studio</strong></footer>
<script>
const menuToggle = document.querySelector('.menu-toggle');
const siteMenu = document.querySelector('#site-menu');
function setMenuOpen(open) {
  menuToggle.setAttribute('aria-expanded', String(open));
  siteMenu.hidden = !open;
}
menuToggle.addEventListener('click', () => setMenuOpen(siteMenu.hidden));
document.addEventListener('click', event => {
  if (!siteMenu.hidden && !event.target.closest('.menu-toggle, .site-menu')) setMenuOpen(false);
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !siteMenu.hidden) {
    setMenuOpen(false);
    menuToggle.focus();
  }
});
</script>
<script src="assets/showcase.js"></script>
</body>
</html>
